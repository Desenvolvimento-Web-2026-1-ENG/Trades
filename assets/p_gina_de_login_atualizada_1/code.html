<script>
        // Micro-interactions for the high-fidelity feel
        document.addEventListener('mousemove', (e) => {
            const panels = document.querySelectorAll('.glass-panel');
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            panels.forEach(panel => {
                const rect = panel.getBoundingClientRect();
                const x = mouseX - rect.left;
                const y = mouseY - rect.top;

                // Subtle tilt effect
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = (y - centerY) / 50;
                const rotateY = (centerX - x) / 50;

                panel.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                
                // Mouse-following highlight
                panel.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(116, 245, 255, 0.08) 0%, rgba(24, 32, 44, 0.4) 50%)`;
            });
        });

        // Reset panel on mouse leave
        document.addEventListener('mouseleave', () => {
            const panels = document.querySelectorAll('.glass-panel');
            panels.forEach(panel => {
                panel.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
                panel.style.background = 'rgba(24, 32, 44, 0.4)';
            });
        });
    </script>
